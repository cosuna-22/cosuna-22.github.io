<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CIERZO App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: desktop = guía de la demo + móvil enmarcado; móvil = la app a pantalla completa. Vista de app: scroll + barra de acción fija + tabbar */
:root{
  --night:#14212B; --cream:#F3EFE8; --clay:#9A4A22; --sky:#6FA8CF;
  --bg:#E9E3D8; --surface:#F7F4EE; --card:#FFFFFF; --ink:#14212B; --muted:#56616C; --line:#E2DACD;
  --accent:#9A4A22; --accent-ink:#FFFFFF; --brand:#2F5D7C; --ok:#2F6B3A; --ok-bg:#E3EFE2; --chip:#EFE9DF;
  --hero:#14212B; --hero-ink:#F3EFE8; --hero-muted:#A9B6C1; --hero-line:rgba(243,239,232,.14);
  --map-land:#ECE5D9; --map-road:#FFFFFF; --map-road-2:#DDD3C4; --map-water:#A9C7DA; --map-water-label:#3E6E8E; --map-park:#CFDDBF; --map-park-label:#56713F; --map-label:#3B4650; --map-street:#6F7983; --map-landmark:#9A4A22; --map-partner:#2F5D7C; --map-closed:#9AA3AB;
  --f-display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-body:'Work Sans','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1117; --surface:#111C25; --card:#1A2934; --ink:#F3EFE8; --muted:#A9B6C1; --line:#29404F;
  --accent:#D0794A; --accent-ink:#14212B; --brand:#6FA8CF; --ok:#86C994; --ok-bg:#1F3A2A; --chip:#223645;
  --hero:#24394A; --hero-ink:#F3EFE8; --hero-muted:#B9C6D0; --hero-line:rgba(243,239,232,.16); --map-land:#16232D; --map-road:#2A3B48; --map-road-2:#22323E; --map-water:#24485E; --map-water-label:#8FB7D0; --map-park:#1F3A2C; --map-park-label:#8DB48A; --map-label:#C9D3DB; --map-street:#8796A2; --map-landmark:#D0794A; --map-partner:#6FA8CF; --map-closed:#5B6873; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0A1117; --surface:#111C25; --card:#1A2934; --ink:#F3EFE8; --muted:#A9B6C1; --line:#29404F;
  --accent:#D0794A; --accent-ink:#14212B; --brand:#6FA8CF; --ok:#86C994; --ok-bg:#1F3A2A; --chip:#223645;
  --hero:#24394A; --hero-ink:#F3EFE8; --hero-muted:#B9C6D0; --hero-line:rgba(243,239,232,.16); --map-land:#16232D; --map-road:#2A3B48; --map-road-2:#22323E; --map-water:#24485E; --map-water-label:#8FB7D0; --map-park:#1F3A2C; --map-park-label:#8DB48A; --map-label:#C9D3DB; --map-street:#8796A2; --map-landmark:#D0794A; --map-partner:#6FA8CF; --map-closed:#5B6873; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
p{margin:0}

/* ---------- Escenario (desktop) ---------- */
.stage{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:56px;align-items:center;max-width:1200px;margin:0 auto;padding-block:32px;padding-inline:40px}
.guide{display:flex;flex-direction:column;gap:20px;min-width:0}
.brandrow{display:flex;align-items:center;gap:12px}
.brandrow .word{font-family:var(--f-display);font-weight:800;letter-spacing:.18em;font-size:24px}
.guide h1{font-size:40px;line-height:1.05;font-weight:800}
.guide p{color:var(--muted);max-width:52ch}
.steps{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.steps button{width:100%;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:transparent;border:1px solid transparent;border-radius:12px;padding:9px 12px}
.steps button:hover{background:var(--card)}
.steps button[aria-current="true"]{background:var(--card);border-color:var(--line)}
.steps .n{font-family:var(--f-display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.steps .t{font-weight:600}
.steps .d{display:block;font-size:13px;color:var(--muted);font-weight:400}
.mf{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--chip);white-space:nowrap}
.mf.hot{background:var(--accent);color:var(--accent-ink)}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-weight:600;align-self:flex-start}

.phone{width:390px;height:min(820px,calc(100dvh - 64px));min-height:640px;border-radius:46px;background:#0B1218;padding:10px;box-shadow:0 30px 60px -30px rgba(20,33,43,.6)}
.app{position:relative;height:100%;border-radius:37px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
#view{display:flex;flex-direction:column;height:100%}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.screen{padding:4px 18px 24px;display:flex;flex-direction:column;gap:14px}

@media (max-width:900px){
  .stage{display:block;padding:0;max-width:none;height:100%}
  .guide{display:none}
  .phone{width:100%;height:100%;min-height:0;border-radius:0;padding:0;box-shadow:none;background:var(--surface)}
  .app{border-radius:0}
}

/* ---------- Chrome de la app ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 10px;min-height:68px}
.topbar .title{font-family:var(--f-display);font-weight:700;font-size:17px;flex:1;text-align:center}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;letter-spacing:.16em;font-size:17px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.spacer{width:42px;flex:none}
.tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:var(--card);padding:4px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:8px 0 4px;position:relative;min-height:52px}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;left:calc(50% - 14px);width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tabbar button[aria-current="page"] svg{stroke:var(--accent)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}
.actionbar{padding:10px 18px;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}

/* ---------- Componentes ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.h-xl{font-size:28px;font-weight:800;line-height:1.08}
.h-lg{font-size:20px;font-weight:700;font-family:var(--f-display)}
.h-md{font-size:16px;font-weight:700;font-family:var(--f-display)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:600;min-height:50px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--night);color:var(--cream)}
.btn.line{background:var(--card);border:1px solid var(--line)}
.btn.split{justify-content:space-between}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;min-height:42px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid2 .chip{border-radius:12px;width:100%}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--chip);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.off{background:var(--chip);color:var(--muted)}
.mapbox.tall{height:330px}
.pcard{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.pcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.pc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pc-name{font-family:var(--f-display);font-weight:700;font-size:16px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--chip)}
.tag.best{background:var(--accent);color:var(--accent-ink)}
.pc-times{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:2px}
.pc-times>span:not(.save){background:var(--chip);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}
.pc-times b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.save{grid-column:1/-1;font-size:13px;font-weight:600;color:var(--ok)}
.pclosed{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border:1px dashed var(--line);border-radius:14px}
.simrow{display:flex;gap:6px;flex-wrap:wrap}
.simrow button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.simrow button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.mapbox{height:290px;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.pt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.pt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.waits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:6px}
.waits div{background:var(--chip);border-radius:10px;padding:6px 8px;font-size:12px}
.waits b{display:block;font-family:var(--f-display);font-size:16px}
.divider{height:1px;background:var(--line)}
.tile{width:56px;height:56px;border-radius:14px;background:var(--chip);display:grid;place-items:center;flex:none}

/* Hero: bloque de marca */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero .muted,.hero .eyebrow{color:var(--hero-muted)}
.hero .wind{position:absolute;right:-24px;bottom:-30px;opacity:.06;pointer-events:none}
.hero .btn.line{background:transparent;border-color:var(--hero-line);color:var(--hero-ink)}
.bar{height:8px;border-radius:5px;background:var(--chip);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .6s ease}
.hero .bar{background:var(--hero-line)}
.hero .bar>span{background:var(--sky)}

/* Lista de carta */
.item{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px 10px 10px;text-align:left;width:100%}
.item .name{font-weight:600;display:block}
.item .desc{font-size:13px;color:var(--muted);display:block}
.meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.meta span{font-size:11px;font-weight:600;color:var(--muted);background:var(--chip);border-radius:6px;padding:2px 6px;font-variant-numeric:tabular-nums}
.segment{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--chip);border-radius:12px;padding:4px;gap:4px}
.segment button{border:0;background:transparent;border-radius:9px;padding:9px;font-weight:600;min-height:42px}
.segment button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.fav{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px}

/* Hojas, avisos y seguimiento */
.scrim{position:absolute;inset:0;background:rgba(10,17,23,.5);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--surface);width:100%;border-radius:24px 24px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;max-height:90%;overflow-y:auto}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.toast{position:absolute;left:10px;right:10px;top:10px;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:center;box-shadow:0 12px 30px -12px rgba(0,0,0,.35);animation:drop .35s ease}
.toast .ic{width:36px;height:36px;border-radius:10px;background:var(--night);display:grid;place-items:center}
@keyframes drop{from{transform:translateY(-120%)}to{transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.live{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:pulse 1.4s ease infinite}
@media (prefers-reduced-motion: reduce){.toast,.live{animation:none}.bar>span{transition:none}}
.banner{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--accent);border-radius:16px;padding:12px 14px;text-align:left;width:100%}
.track{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.track .seg{height:6px;border-radius:4px;background:var(--hero-line)}
.track .seg.on{background:var(--sky)}
.pickup{font-family:var(--f-display);font-weight:800;font-size:40px;letter-spacing:.06em;line-height:1}
.stars{display:flex;gap:4px}
.stars button{background:none;border:0;padding:6px;min-width:44px;min-height:44px}
.qrwrap{background:#FFFFFF;border-radius:16px;padding:12px;display:grid;place-items:center;gap:6px}
.qrwrap canvas{image-rendering:pixelated}
.qrwrap .code{font-family:var(--f-display);font-weight:700;letter-spacing:.2em;color:#14212B;font-size:12px}
.switch{position:relative;width:48px;height:28px;border-radius:14px;background:var(--line);border:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#FFF;transition:transform .2s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* Bienvenida */
.welcome{flex:1;display:flex;flex-direction:column;justify-content:space-between;background:var(--night);color:var(--cream);padding:28px 22px calc(22px + env(safe-area-inset-bottom,0px));gap:22px;overflow-y:auto}
.welcome .muted{color:#A9B6C1}
.welcome .btn.line{background:transparent;border:1px solid #3A5163;color:var(--cream)}
.welcome .btn.primary{background:#9A4A22;color:#FFFFFF}
.how{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.how li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center}
.how .num{width:40px;height:40px;border-radius:12px;background:#1F3344;display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.offer{background:#9A4A22;color:#FFF;border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.linkbtn{background:none;border:0;text-decoration:underline;text-underline-offset:3px;padding:10px;min-height:44px}
</style>

<div class="stage">
  <aside class="guide" aria-label="Guía de la demo">
    <div class="brandrow">
      <svg width="36" height="28" viewBox="0 0 40 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M3 8h22a5 5 0 1 0-5-5"/><path d="M3 16h30"/><path d="M3 24h18a5 5 0 1 1-5 5"/></svg>
      <span class="word">CIERZO</span>
    </div>
    <h1>La app de la fase 1</h1>
    <p>Prototipo funcional: pide sin colas, recoge en el mostrador app y suma puntos con tu QR. Cada pantalla resuelve un microfunnel del plan.</p>
    <ol class="steps" id="steps"></ol>
    <div class="stack" style="gap:6px"><span class="small" style="color:var(--muted)">Hora de la demo (aperturas y esperas)</span><div class="simrow" id="sim" role="group" aria-label="Hora simulada"></div></div>
    <button class="ghost" id="reset" type="button">Reiniciar demo</button>
    <p class="small">Prototipo para clase: registro, pagos, avisos y QR están simulados.</p>
  </aside>

  <div class="phone">
    <div class="app" id="app">
      <div id="view"></div>
      <div id="layer"></div>
    </div>
  </div>
</div>

<script>
/* CIERZO · red de puntos (simulada) y plano esquemático de Zaragoza */
(function(){
const POINTS = [
  {id:'centro', short:'Centro', go:6, name:'CIERZO Centro', kind:'Tienda CIERZO', type:'store', zone:'Calle Coso · junto a plaza de España', x:640, y:402,
   hours:{wk:[450,1200], sat:[540,840], sun:[540,840]}, paso:12, app:3, prepares:true,
   why:'Nuestra tienda: escaparate de marca, formación de partners y control de calidad.'},
  {id:'campus', short:'Campus', go:9, name:'Punto CIERZO Campus', kind:'Partner · cafetería universitaria', type:'partner', zone:'Campus San Francisco (Universidad de Zaragoza)', x:505, y:598,
   hours:{wk:[450,1140], sat:null, sun:null}, paso:10, app:3, prepares:true,
   why:'Miles de estudiantes y personal cada mañana: el núcleo de nuestro buyer persona.'},
  {id:'delicias', short:'Delicias', go:22, name:'Punto CIERZO Delicias', kind:'Partner · quiosco en la estación', type:'partner', zone:'Estación Zaragoza-Delicias', x:168, y:436,
   hours:{wk:[390,1320], sat:[390,1320], sun:[420,1320]}, paso:8, app:2, prepares:true,
   why:'Viajeros con prisa y horario amplio todos los días: el pedido programado tiene todo el sentido.'},
  {id:'ranillas', short:'Ranillas', go:20, name:'Punto CIERZO Ranillas', kind:'Partner · coworking', type:'partner', zone:'Zona Expo · Actur-Ranillas (oficinas)', x:402, y:168,
   hours:{wk:[480,1080], sat:null, sun:null}, paso:6, app:2, prepares:true,
   why:'Oficinas y empresas tecnológicas: pedidos de equipo y recogida a hora fija.'}
];
const DAYS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const fmt = m => String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function slot(p, dow){ return dow===0 ? p.hours.sun : dow===6 ? p.hours.sat : p.hours.wk; }
function status(p, d){
  const dow=d.getDay(), min=d.getHours()*60+d.getMinutes(), s=slot(p,dow);
  if(s && min>=s[0] && min<s[1]){
    const h=d.getHours(); const f = (h>=8&&h<10)?1 : (h>=13&&h<15)?0.8 : (h>=10&&h<13)||(h>=17&&h<19)?0.6 : 0.4;
    return {open:true, until:'Abierto hasta las '+fmt(s[1]), paso:Math.max(1,Math.round(p.paso*f)), app:Math.max(1,Math.round(p.app*f))};
  }
  for(let i=0;i<8;i++){
    const dd=(dow+i)%7, ss=slot(p,dd); if(!ss) continue;
    if(i===0 && min<ss[0]) return {open:false, until:'Cerrado · abre hoy a las '+fmt(ss[0])};
    if(i>0) return {open:false, until:'Cerrado · abre '+(i===1?'mañana':'el '+DAYS[dd])+' a las '+fmt(ss[0])};
  }
  return {open:false, until:'Cerrado'};
}
function hoursText(p){

function mount(el, opts={}){
  const ns='http://www.w3.org/2000/svg';
  const full=opts.view||{x:70,y:80,w:780,h:600};
  let vb={...full}, selected=opts.selected||null, now=opts.date||new Date();
  el.innerHTML = `<div class="cmap" style="position:relative;height:100%;width:100%;overflow:hidden;border-radius:inherit;touch-action:none;background:var(--map-land)">
    <svg viewBox="${vb.x} ${vb.y} ${vb.w} ${vb.h}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;display:block;cursor:grab" role="img" aria-label="Plano esquemático de Zaragoza con los puntos CIERZO">${BASE}<g class="pins"></g></svg>

      <button type="button" data-z="in" aria-label="Acercar" style="width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px;font-weight:600">+</button>

      <button type="button" data-z="reset" aria-label="Ver toda la red" style="width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:700">Todo</button></div>`}

  </div>`;
  const svg=el.querySelector('svg'), pins=el.querySelector('.pins');
  const apply=()=>svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  function draw(){
    pins.innerHTML='';
    POINTS.forEach(p=>{
      const st=status(p,now), sel=p.id===selected, r=p.type==='store'?17:14;
      const g=document.createElementNS(ns,'g'); g.setAttribute('transform',`translate(${p.x} ${p.y})`); g.style.cursor='pointer';
      g.setAttribute('tabindex','0'); g.setAttribute('role','button'); g.setAttribute('aria-label',`${p.name}, ${st.open?'abierto':'cerrado'}`);
      const fill = !st.open ? 'var(--map-closed)' : p.type==='store' ? 'var(--accent)' : 'var(--map-partner)';
      g.innerHTML = `${sel?`<circle r="${r+10}" fill="${fill}" opacity=".22"/>`:''}
        <circle r="${r}" fill="${fill}" stroke="var(--map-land)" stroke-width="4"/>
        ${p.type==='store'?'<path d="M-8,-3 h10 a4,4 0 1 0 -4,-4 M-8,2 h15 M-8,7 h8" fill="none" stroke="#FFF" stroke-width="2.4" stroke-linecap="round"/>':'<circle r="4.5" fill="#FFF"/>'}
        ${opts.short?`<g transform="translate(${r+6} 6)"><rect x="-4" y="-22" width="${Math.max(p.short.length,st.open?7:7)*13+14}" height="${st.open?50:30}" rx="8" fill="var(--card)" stroke="${sel?fill:'var(--line)'}" stroke-width="${sel?2.5:1}"/>
          <text x="4" y="0" font-family="Work Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="var(--ink)">${p.short}</text>
          ${st.open?`<text x="4" y="22" font-family="Work Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="var(--muted)">${st.app} min</text>`:''}</g>`
        :`<g transform="translate(${r+8} 5)"><rect x="-4" y="-17" width="${p.name.length*8.4+12}" height="${st.open?44:26}" rx="7" fill="var(--card)" stroke="var(--line)"/>
        <text x="3" y="0" font-family="Work Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="var(--ink)">${p.name}</text>
        ${st.open?`<text x="3" y="19" font-family="Work Sans, Arial, sans-serif" font-size="12" fill="var(--muted)">App ${st.app} min · Paso ${st.paso} min</text>`:''}</g>`}`;
      const pick=e=>{ e.stopPropagation(); selected=p.id; draw(); opts.onSelect && opts.onSelect(p, status(p,now)); };
      g.addEventListener('click',pick); g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(e);} });
      pins.appendChild(g);
    });
  }
  if(opts.me){ const g=document.createElementNS(ns,'g'); g.setAttribute('transform',`translate(${opts.me.x} ${opts.me.y})`); g.setAttribute('aria-hidden','true');
    g.innerHTML=`<circle r="22" fill="#378ADD" opacity=".18"/><circle r="9" fill="#378ADD" stroke="#FFF" stroke-width="3"/><text x="0" y="40" text-anchor="middle" font-family="Work Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="var(--ink)">Tú</text>`;
    svg.insertBefore(g, pins); }
  function zoom(k, cx, cy){
    const nw=Math.min(full.w*1.2, Math.max(260, vb.w*k)), nh=nw*full.h/full.w;
    cx = cx ?? vb.x+vb.w/2; cy = cy ?? vb.y+vb.h/2;
    vb.x = cx-(cx-vb.x)*nw/vb.w; vb.y = cy-(cy-vb.y)*nh/vb.h; vb.w=nw; vb.h=nh; apply();
  }
  function toSvg(e){ const r=svg.getBoundingClientRect(); const s=Math.max(vb.w/r.width, vb.h/r.height); return {x:vb.x+(e.clientX-r.left)*s - (r.width*s-vb.w)/2, y:vb.y+(e.clientY-r.top)*s-(r.height*s-vb.h)/2, s}; }
  el.addEventListener('click',e=>{ const b=e.target.closest('[data-z]'); if(!b) return; const z=b.dataset.z; if(z==='in') zoom(.7); else if(z==='out') zoom(1.4); else { vb={...full}; apply(); } });
  if(opts.interactive!==false){
    let drag=null;
    svg.addEventListener('pointerdown',e=>{ if(e.target.closest('.pins g')) return; drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y}; svg.setPointerCapture(e.pointerId); svg.style.cursor='grabbing'; });
    svg.addEventListener('pointermove',e=>{ if(!drag) return; const r=svg.getBoundingClientRect(); const s=Math.max(vb.w/r.width, vb.h/r.height); vb.x=drag.vx-(e.clientX-drag.x)*s; vb.y=drag.vy-(e.clientY-drag.y)*s; apply(); });
    const end=()=>{ drag=null; svg.style.cursor='grab'; };
    svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);
    svg.addEventListener('wheel',e=>{ e.preventDefault(); const p=toSvg(e); zoom(e.deltaY<0?.85:1.18, p.x, p.y); },{passive:false});
  }
  draw();
  return {
    select(id,pan){ selected=id; draw(); const p=POINTS.find(q=>q.id===id); if(p&&pan&&vb.w<full.w){ vb.x=p.x-vb.w/2; vb.y=p.y-vb.h/2; apply(); } },
    setDate(d){ now=d; draw(); }
  };
}
window.CierzoMap = {POINTS, status, hoursText, mount};

        <div><div class="h-lg">${m.name}</div><div class="small muted">${m.desc}</div>${m.cat==='cafe'?`<div class="meta"><span>${m.ml} ml</span><span>${m.ratio}</span></div>`:''}</div>
      </div>
      ${m.milk?`<div class="stack"><div class="eyebrow">Leche</div><div class="chips">${MILKS.map(x=>`<button class="chip" type="button" data-milk="${x.id}" aria-pressed="${sel.milk===x.id}">${x.name}${x.add?' +'+eur(x.add):''}</button>`).join('')}</div></div>`:''}
      ${m.cat==='cafe'?`<div class="stack"><div class="eyebrow">Café</div><div class="chips"><button class="chip" type="button" data-decaf="0" aria-pressed="${!sel.decaf}">Normal</button><button class="chip" type="button" data-decaf="1" aria-pressed="${sel.decaf}">Descafeinado</button></div></div>`:''}
      <div class="row"><span class="eyebrow">Cantidad</span><div style="display:flex;align-items:center;gap:10px"><button class="iconbtn" type="button" data-sq="-1" aria-label="Menos">${ic('minus',18)}</button><span class="price">${sel.qty}</span><button class="iconbtn" type="button" data-sq="1" aria-label="Más">${ic('plus',18)}</button></div></div>
      <button class="btn primary split" type="button" data-addsel="1"><span>Añadir al pedido</span><span class="price">${eur(price)}</span></button>
    </div></div>`;
  };
  draw();
  $('#layer').onclick=e=>{
    if(e.target.dataset && e.target.dataset.close){ closeLayer(); return; }
    const t=e.target.closest('button'); if(!t) return;
    if(t.dataset.milk){sel.milk=t.dataset.milk;draw();}
    else if(t.dataset.decaf){sel.decaf=t.dataset.decaf==='1';draw();}
    else if(t.dataset.sq){sel.qty=Math.max(1,sel.qty+Number(t.dataset.sq));draw();}
    else if(t.dataset.addsel){ addLine({id, milk:m.milk?sel.milk:'entera', decaf:sel.decaf, qty:sel.qty}); closeLayer(); if(S.screen!=='menu'&&S.screen!=='cart'){S.screen='menu';} render(); toast('bag','Añadido al pedido', `${sel.qty} × ${m.name}`); }
  };
}
function sheetQR(){
  $('#layer').innerHTML=`<div class="scrim" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="Mi QR">
    <div class="grab"></div>
    <div style="text-align:center" class="stack"><div class="h-lg">Tu QR del Club</div><div class="small muted">Enséñalo al pagar en caja y el barista suma tus puntos.</div></div>
    <div class="qrwrap"><canvas id="qr" width="29" height="29" style="width:200px;height:200px" aria-label="Código QR personal"></canvas><div class="code">CZ-7Q4L-2026</div></div>
    <button class="btn dark" type="button" data-scan="1">Simular escaneo en caja (+10 puntos)</button>
    <button class="btn line" type="button" data-closebtn="1">Cerrar</button>
  </div></div>`;
  drawQR($('#qr'));
  $('#layer').onclick=e=>{
    if(e.target.dataset && e.target.dataset.close){ closeLayer(); return; }
    const t=e.target.closest('button'); if(!t) return;
    if(t.dataset.closebtn) closeLayer();
    else if(t.dataset.scan){ closeLayer(); scan(); }
  };
}
function closeLayer(){ $('#layer').innerHTML=''; $('#layer').onclick=null; }
function toast(icon,title,body){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status');
  el.innerHTML=`<span class="ic">${ic(icon,20,'#F3EFE8')}</span><div><div style="font-weight:600">${title}</div><div class="small muted">${body}</div></div>`;
  $('#app').appendChild(el); setTimeout(()=>el.remove(),2800);
}
function drawQR(c){
  if(!c) return; const n=29, x=c.getContext('2d'); x.fillStyle='#FFFFFF'; x.fillRect(0,0,n,n); x.fillStyle='#14212B';
  let seed=20261003; const rnd=()=>(seed=(seed*1103515245+12345)%2147483648)/2147483648;
  const inF=(i,j)=>(i<8&&j<8)||(i>n-9&&j<8)||(i<8&&j>n-9);
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){ if(!inF(i,j) && rnd()>.52) x.fillRect(i,j,1,1); }
  const finder=(ox,oy)=>{for(let i=0;i<7;i++)for(let j=0;j<7;j++){ if(i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4)) x.fillRect(ox+i,oy+j,1,1);}};
  finder(0,0); finder(n-7,0); finder(0,n-7);
}

/* ---------- Acciones ---------- */
function addLine(l){ const same=S.cart.find(c=>c.id===l.id&&c.milk===l.milk&&c.decaf===l.decaf); if(same) same.qty+=l.qty; else S.cart.push(l); }
function addPoints(p,t){ S.points+=p; if(p>0) S.lifetime+=p; S.history.unshift({t,pts:p,d:'Ahora'}); }
function scan(){ addPoints(10,'Café en tienda (QR)'); render(); toast('star','+10 puntos', `Escaneado en caja. Llevas ${S.points} puntos.`); }
function pay(){
  const mins = S.pickup==='asap' ? 4 : Number(S.pickup);
  const o={num:String(Math.floor(100+Math.random()*800)), lines:S.cart.map(l=>({...l})), pts:earn(), step:0, rated:0, collected:false, time:hhmm(new Date(Date.now()+mins*60000))};
  const c=S.cart.find(l=>item(l.id).cat==='cafe'); if(c) S.last={id:c.id,milk:c.milk,decaf:c.decaf};
  addPoints(o.pts,'Pedido app #'+o.num);
  S.order=o; S.cart=[]; S.firstOrder=false; S.screen='status'; render();
  timers.forEach(clearTimeout); timers=[];
  timers.push(setTimeout(()=>{ if(S.order===o){o.step=1; render();} },2200));
  timers.push(setTimeout(()=>{ if(S.order===o){o.step=2; render(); if(S.notif.ready) toast('bell','Tu pedido está listo', `Mostrador app · di "${S.name} · ${o.num}".`);} },5200));
}
function go(screen){
  if(screen==='cart' && !S.cart.length && activeOrder()) screen='status';
  if(screen==='status' && !S.order){ S.registered=true; addLine({id:'flatwhite',milk:'avena',decaf:false,qty:1}); pay(); return; }
  if(screen!=='welcome' && screen!=='menu') S.registered = true;
  if(screen==='points' && S.screen!=='points'){ S.pointBack=S.screen; S.pointDraft=S.point; S.pointsView='list'; }
  S.screen=screen; closeLayer(); render();
  const sc=$('#scroller'); if(sc) sc.scrollTop=0;
}

/* ---------- Render ---------- */
function render(){
  const v=$('#view'), scrollTop = $('#scroller') ? $('#scroller').scrollTop : 0, same = v.dataset.screen===S.screen;
  if(S.screen==='welcome'){ v.innerHTML=vWelcome(); }
  else {
    const body = {home:vHome, points:vPoints, menu:vMenu, cart:vCart, status:vStatus, club:vClub, profile:vProfile}[S.screen]();
    v.innerHTML=`<div class="scroll" id="scroller">${body}</div>${actionbar()}${S.registered?tabbar():''}`;
    if(same) $('#scroller').scrollTop = scrollTop;
  }
  v.dataset.screen=S.screen;
  if(S.screen==='club') drawQR($('#qrsmall'));
  if(S.screen==='points' && $('#appmap')){ CierzoMap.mount($('#appmap'),{selected:S.pointDraft||S.point, short:true, controls:false, date:nowD(), me:{x:594,y:508}, view:{x:110,y:130,w:690,h:520}, onSelect:(p,st)=>{ if(!st.open){ toast('clock',p.short+' está cerrado',st.until); return; } S.pointDraft=p.id; render(); }}); }
  const sim=$('#sim'); if(sim) sim.innerHTML=SIMS.map(([k,l])=>`<button type="button" data-sim="${k}" aria-pressed="${(S.sim||'now')===k}">${l}</button>`).join('');
  $('#steps').innerHTML=SCREENS.map((s,i)=>`<li><button type="button" data-jump="${s.id}" aria-current="${S.screen===s.id}"><span class="n">${String(i+1).padStart(2,'0')}</span><span class="t">${s.t}<span class="d">${s.d}</span></span><span class="mf ${s.hot?'hot':''}">${s.mf}</span></button></li>`).join('');
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b || b.closest('#layer') || b.id==='reset') return;
  const d=b.dataset;
  if(d.jump){ S.registered = d.jump!=='welcome'; go(d.jump); return; }
  if(d.go){ go(d.go); return; }
  if(d.point){ S.pointDraft=d.point; render(); return; }
  if(d.pview){ S.pointsView=d.pview; render(); return; }
  if(d.sim){ S.sim=d.sim; render(); return; }
  if(d.cat){ S.menuCat=d.cat; render(); return; }
  if(d.open){ sheetProduct(d.open); return; }
  if(d.qty){ const [i,dl]=d.qty.split(':').map(Number); S.cart[i].qty+=dl; if(S.cart[i].qty<=0) S.cart.splice(i,1); render(); return; }
  if(d.addquick){ addLine({id:d.addquick,milk:'entera',decaf:false,qty:1}); render(); return; }
  if(d.pickup){ S.pickup=d.pickup; render(); return; }
  if(d.pay){ S.pay=d.pay; render(); return; }
  if(d.rate && S.order){ S.order.rated=Number(d.rate); render(); return; }
  if(d.notif){ S.notif[d.notif]=!S.notif[d.notif]; render(); return; }
  if(d.redeem){ const r=REWARDS.find(x=>x.id===d.redeem); if(S.points>=r.pts){ addPoints(-r.pts,'Canje: '+r.name); render(); toast('gift','Premio canjeado', r.name+'. Enséñalo en caja hoy.'); } return; }
  switch(d.act){
    case 'register': S.registered=true; go(S.cart.length?'cart':'home'); toast('gift','Bienvenida, '+S.name, 'Tu 20 % se aplica al pagar el primer pedido.'); break;
    case 'browse': S.registered=false; go('menu'); break;
    case 'qr': sheetQR(); break;
    case 'scan': scan(); break;
    case 'repeat': addLine({...S.last, qty:1}); go('cart'); break;
    case 'pay': if(CierzoMap.status(curPoint(),nowD()).open) pay(); break;
    case 'choosePoint': { const back=S.pointBack; S.point=S.pointDraft||S.point; const p=curPoint(); go(back==='cart'?'cart':'menu'); toast('pin','Recogerás en '+p.short, back==='cart'?'Ya puedes pagar tu pedido.':'Elige tu café.'); break; }
    case 'collected': S.order.collected=true; go('home'); toast('check','¡Que lo disfrutes!','Tus puntos ya están en el Club.'); break;
    case 'bean': S.beanAlert=!S.beanAlert; render(); if(S.beanAlert) toast('bean','Te avisaremos','Serás de los primeros en probar el grano CIERZO.'); break;
    case 'copy': {
      const done=()=>toast('check','Código copiado','Compártelo con quien quieras.');
      const sel=()=>{ const el=$('#refcode'); const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); };
      try{ navigator.clipboard.writeText('LUCIA-CIERZO').then(done).catch(sel); }catch(_){ sel(); }
      break; }
    case 'reset': reset(); break;
  }
});
function reset(){ timers.forEach(clearTimeout); timers=[]; S=fresh(); closeLayer(); document.querySelectorAll('.toast').forEach(t=>t.remove()); render(); }
$('#reset').addEventListener('click',reset);
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('#layer').innerHTML) closeLayer(); });
render();
})();
</script>
